services:
  blog:
    # 默认拉取 GHCR 镜像(由 .github/workflows/docker-publish.yml 在 push 时自动构建推送)
    # 本地改代码想跑新构建: docker compose up -d --build
    image: ghcr.io/mako07210721/blog:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-8080}:8080"
    volumes:
      # 命名卷持久化数据库与上传文件,容器重建/升级不丢数据
      - blog-data:/data

volumes:
  blog-data: