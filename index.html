<!-- 圆形水波过渡层（播完跳转简介页） -->

<!-- 悬浮音乐播放器 -->
<div class="music-player" id="musicPlayer">
  <div class="mp-inner">
    <div class="mp-disc" id="mpDisc">
      <span class="mp-disc-hole"></span>
    </div>
    <div class="mp-info">
      <div class="mp-title">恋せよ乙女!</div>

    </div>
    <div class="mp-progress">
      <div class="mp-bar" id="mpBar"><div class="mp-bar-fill" id="mpFill"></div></div>
      <div class="mp-time"><span id="mpCurrent">00:00</span><span>/</span><span id="mpDuration">--:--</span></div>
    </div>

      <input type="range" id="mpVolume" min="0" max="1" step="0.02" value="0.4" aria-label="音量">

    </div>
  </div>
  <button class="mp-float" id="mpToggle" aria-label="打开播放器">♪</button>

</div>

<script src="assets/js/player.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/album.js"></script>
<script>
(async function () {
  const wrap = document.getElementById('posts');
  const catList = document.getElementById('categoryList');
  let posts = [];
  let activeCat = null;
  let CATEGORIES = [];

  function showEmpty(msg) {
    wrap.textContent = '';
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = msg;
    wrap.appendChild(p);
  }

  // 按当前 activeCat 渲染文章列表;activeCat===null 展示全部
  function renderPosts(list) {
    wrap.textContent = '';
    if (!Array.isArray(list) || !list.length) {
      showEmpty(activeCat ? '「' + activeCat + '」还没有文章,先写一篇吧ヽ(=^･ω･^=)丿' : '暂无文章,敬请期待ヽ(=^･ω･^=)丿');
      return;
    }
    list.forEach((post) => {
      const art = document.createElement('article');
      art.className = 'post';

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      const d = document.createElement('span');
      d.textContent = post.created_at;
      const dot = document.createElement('span');
      dot.textContent = '·';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = post.tag || '未分类';
      meta.append(d, dot, tag);

      const h2 = document.createElement('h2');
      const a = document.createElement('a');
      a.href = 'post.html?id=' + post.id;
      a.textContent = post.title;
      h2.appendChild(a);

      const ex = document.createElement('p');
      ex.className = 'excerpt';
      ex.textContent = post.excerpt;

      const rm = document.createElement('a');
      rm.className = 'read-more';
      rm.href = 'post.html?id=' + post.id;
      rm.textContent = '继续阅读 →';

      art.append(meta, h2, ex, rm);
      wrap.appendChild(art);
    });
  }

  // 侧栏分类:预置分类(来自 /api/categories) + 文章里出现的额外分类,均带真实计数
  function renderCategories() {
    if (!catList) return;
    catList.textContent = '';

    const cats = CATEGORIES.slice();
    const counts = {};
    posts.forEach((p) => {
      const t = p.tag || '未分类';
      counts[t] = (counts[t] || 0) + 1;
    });
    Object.keys(counts).forEach((t) => { if (!cats.includes(t)) cats.push(t); });

    const addItem = (label, count) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#posts';
      a.dataset.cat = label;
      a.className = activeCat === label ? 'active' : '';
      const txt = document.createElement('span');
      txt.textContent = label + ' ';
      const cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = count;
      a.append(txt, cnt);
      a.addEventListener('click', (e) => {
        e.preventDefault();
        activeCat = (activeCat === label) ? null : label; // 再点一次取消过滤,回到全部
        const list = activeCat ? posts.filter((p) => (p.tag || '未分类') === label) : posts;
        renderPosts(list);
        renderCategories();
      });
      li.appendChild(a);
      catList.appendChild(li);
    };

    addItem('全部', posts.length);
    cats.forEach((c) => addItem(c, counts[c] || 0));
  }

  wrap.textContent = ''; // 一进来就清掉静态「加载中…」占位,避免任何情况下残留
  try {
    const res = await fetch('/api/posts');
    if (!res.ok) throw new Error('http ' + res.status);
    posts = await res.json();
    posts = Array.isArray(posts) ? posts : [];
  } catch {
    posts = [];
  }
  try {
    const c = await (await fetch('/api/categories')).json();
    CATEGORIES = (c && Array.isArray(c.categories)) ? c.categories : CATEGORIES;
  } catch {}
  renderCategories();
  renderPosts(posts);
})();
</script>
<script>
// 右上角「登录/文章」进后台:套用同一套水波动画
(function () {
  const ripple = document.getElementById('ripple');
  const targets = document.querySelectorAll('.login-entry, .article-entry');
  if (!targets.length || !ripple) return;
  targets.forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const cx = e.clientX;
      const cy = e.clientY;
      // 直接写 inline clip-path,完全绕开 CSS 变量 + transition,
      // 避免 clip-path 在 circle() 间插值时对 at 位置的特殊处理。
      // 1) 先瞬时设 0% (不播)
      ripple.style.transition = 'none';
      ripple.style.clipPath = 'circle(0% at ' + cx + 'px ' + cy + 'px)';
      // 2) 强制 reflow 让浏览器把上述 inline 值定格为 from
      void ripple.offsetWidth;
      // 3) 恢复 transition + 设 150%,开始播放
      ripple.style.transition = 'clip-path .78s cubic-bezier(.65, 0, .35, 1)';
      ripple.style.clipPath = 'circle(150% at ' + cx + 'px ' + cy + 'px)';
      document.body.classList.add('profile-reveal');
      el.classList.add('is-hiding');
      setTimeout(() => { window.location.href = el.getAttribute('href'); }, 750);
    });
  });
})();

// 登录后右上角「登录」替换为「文章」:登录态(canManage)显示文章按钮并隐藏登录按钮
(function () {
  const login = document.querySelector('.login-entry');
  const article = document.getElementById('articleBtn');
  if (!login || !article) return;
  (async () => {
    try {
      const me = await (await fetch('/api/me')).json();
      if (me.canManage) {
        login.style.display = 'none';
        article.hidden = false;
      }
    } catch {}
  })();
})();
</script>
</body>
