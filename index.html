</div>

<script src="assets/js/main.js"></script>
<script>
(async function () {
  const wrap = document.getElementById('posts');
  try {
    const res = await fetch('/api/posts');
    if (!res.ok) throw new Error('http ' + res.status);
    const posts = await res.json();
    wrap.textContent = '';
    if (!posts.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '暂无文章,敬请期待ヽ(=^･ω･^=)丿';
      wrap.appendChild(p);
      return;
    }
    posts.forEach((post) => {
      const art = document.createElement('article');
      art.className = 'post';

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      const d = document.createElement('span');
      d.textContent = post.created_at;
      const dot = document.createElement('span');
      dot.textContent = '·';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = post.tag || '未分类';
      meta.append(d, dot, tag);

      const h2 = document.createElement('h2');
      const a = document.createElement('a');
      a.href = 'post.html?id=' + post.id;
      a.textContent = post.title;
      h2.appendChild(a);

      const ex = document.createElement('p');
      ex.className = 'excerpt';
      ex.textContent = post.excerpt;

      const rm = document.createElement('a');
      rm.className = 'read-more';
      rm.href = 'post.html?id=' + post.id;
      rm.textContent = '继续阅读 →';

      art.append(meta, h2, ex, rm);
      wrap.appendChild(art);
    });
  } catch (e) {
    wrap.textContent = '';
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '加载失败,请刷新重试。';
    wrap.appendChild(p);
  }
})();
</script>
<script>
// 右上角「登录」进后台:套用同一套水波动画
(function () {
  const login = document.querySelector('.login-entry');
  const ripple = document.getElementById('ripple');
  if (!login || !ripple) return;
  login.addEventListener('click', (e) => {
    e.preventDefault();
    const r = login.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    ripple.style.setProperty('--cx', cx + 'px');
    ripple.style.setProperty('--cy', cy + 'px');
    document.body.classList.add('profile-reveal');
    login.classList.add('is-hiding');
    setTimeout(() => { window.location.href = login.getAttribute('href'); }, 750);
  });
})();
</script>
