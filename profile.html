<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于沐玺 ✿</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline src="background/Scene1.mp4"></video>
<div class="bg-shade"></div>

<header class="site-header">
  <nav class="nav">
    <div class="brand brand-clock">
      <span class="bc-greet" id="bcGreet">早上好</span>
      <span class="bc-time" id="bcTime">00:00:00</span>
    </div>
    <a class="back-link" href="index.html">← 返回首页</a>
  </nav>
</header>

<main class="profile">
  <div class="profile-card">
    <div class="profile-avatar">MAKO</div>
    <h1>你好，我是<span class="name">沐玺</span></h1>
    <p class="profile-sub">Ciallo～(∠・ω&lt; )⌒☆</p>
    <p class="profile-bio">
      你好啊这里是正在上学的博主Mako，喜欢前端开发和二次元，平时也会写写东西。希望你能喜欢我的博客。
      
    </p>
    <div class="profile-facts">
      <div class="factor">
        <span class="factor-label">爱好</span>
        <span class="factor-value">前端 / 二次元 /游戏/音乐</span>
      </div>
      <div class="factor">
        <span class="factor-label">坐标</span>
        <span class="factor-value">正在施工中</span>
      </div>
      <div class="factor">
        <span class="factor-label">状态</span>
        <span class="factor-value">慢慢装修中</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  Ciallo～(∠・ω&lt; )⌒☆
</footer>

<!-- 悬浮音乐播放器（跨页持久化,自动从上次位置续播） -->
<div class="music-player" id="musicPlayer">
  <div class="mp-inner">
    <div class="mp-disc" id="mpDisc">
      <span class="mp-disc-hole"></span>
    </div>
    <div class="mp-info">
      <div class="mp-title">恋せよ乙女!</div>
      <div class="mp-artist">米倉千尋</div>
    </div>
    <div class="mp-progress">
      <div class="mp-bar" id="mpBar"><div class="mp-bar-fill" id="mpFill"></div></div>
      <div class="mp-time"><span id="mpCurrent">00:00</span><span>/</span><span id="mpDuration">--:--</span></div>
    </div>
    <button class="mp-btn" id="mpPlay" aria-label="播放/暂停">▶</button>
    <div class="mp-vol" id="mpVol">
      <input type="range" id="mpVolume" min="0" max="1" step="0.02" value="0.4" aria-label="音量">
      <button class="mp-vol-btn" id="mpVolBtn" aria-label="音量">🔊</button>
    </div>
  </div>
  <button class="mp-float" id="mpToggle" aria-label="打开播放器">♪</button>
  <audio id="mpAudio" src="music/米倉千尋 - 恋せよ乙女! (恋爱吧少女).mp3"></audio>
</div>

<!-- 圆形水波过渡层（返回首页按钮触发，与首页 hero 进简介的动画一致） -->
<div class="ripple" id="ripple"></div>

<script src="assets/js/player.js"></script>
<script src="assets/js/clock.js"></script>
<script>
(function () {
  // 与 index.html 首页 hero 同一套水波扩散动画，作用到右上角「返回首页」
  const back = document.querySelector('.back-link');
  const ripple = document.getElementById('ripple');
  if (!back || !ripple) return;
  back.addEventListener('click', (e) => {
    e.preventDefault();
    const r = back.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    ripple.style.setProperty('--cx', cx + 'px');
    ripple.style.setProperty('--cy', cy + 'px');
    document.body.classList.add('profile-reveal');
    back.classList.add('is-hiding');
    setTimeout(() => { window.location.href = back.getAttribute('href'); }, 750);
  });
})();

// 后退(bfcache)还原时清掉水波遮罩残留,否则全屏 ripple 永久挡住画面
window.addEventListener('pageshow', (e) => {
  if (!e.persisted) return;
  document.body.classList.remove('profile-reveal');
  document.body.querySelectorAll('.is-hiding').forEach((el) => el.classList.remove('is-hiding'));
});
</script>
</body>
</html>
