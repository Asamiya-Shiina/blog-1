<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面去旅行了 Ciallo～(∠・ω< )⌒☆</title>
<!-- 用绝对路径:404 可能在任意深层 URL 兜底展示,相对路径会算错位置 -->
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/ripple.css">
<style>
  .err-wrap {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .err-card { text-align: center; position: relative; }
  .err-code {
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 2px;
    background: linear-gradient(120deg, #f08fc0, #e9825a, #f0b34a);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 10px 30px rgba(240,143,192,.25);
  }
  .err-note { margin-top: 20px; font-size: 1.05rem; font-weight: 600; color: var(--text); }
  .err-sub  { margin-top: 8px;  color: var(--muted); font-size: .92rem; }
  .err-home {
    display: inline-block;
    margin-top: 30px;
    padding: 10px 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, #c0392b, #e67e22);
    color: #fff !important;
    font-weight: 600;
    font-size: .9rem;
    letter-spacing: .5px;
    box-shadow: 0 4px 12px rgba(230,126,34,.28);
    transition: filter .15s ease, transform .1s ease;
  }
  .err-home:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .err-sparkle {
    position: absolute;
    font-size: 1.2rem;
    opacity: .7;
    animation: err-float 3s ease-in-out infinite;
  }
  .sp-1 { top: -30px; left: -90px; animation-delay: 0s; }
  .sp-2 { top: 8px;   right: -110px; animation-delay: .6s; }
  .sp-3 { bottom: -40px; left: 40px; animation-delay: 1.2s; }
  @keyframes err-float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50%      { transform: translateY(-12px) rotate(12deg); }
  }
</style>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline src="/background/Scene1.mp4"></video>
<div class="bg-shade"></div>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="/">Ciallo～<span>(∠・ω< )⌒☆</span></a>
    <div class="menu">
      <a href="/">← 返回首页</a>
    </div>
  </nav>
</header>

<main class="err-wrap">
  <div class="err-card">
    <span class="err-sparkle sp-1" aria-hidden="true">✿</span>
    <span class="err-sparkle sp-2" aria-hidden="true">✦</span>
    <span class="err-sparkle sp-3" aria-hidden="true">♡</span>
    <div class="err-code">404</div>
    <p class="err-note">诶，页面好像去旅行了 ✧</p>
    <p class="err-sub">你找的地址不存在，或已经被移动了。</p>
    <a class="err-home" id="errHome" href="/" data-ripple>回首页看看</a>
  </div>
</main>

<footer class="site-footer">
  Ciallo～(∠・ω&lt; )⌒☆
</footer>

<!-- 圆形水波过渡层:点击「回首页看看」触发,与主页进入简介用的同一套动画 -->
<div class="ripple" id="ripple"></div>

<script src="/assets/js/ripple.js"></script>

</body>
</html>
