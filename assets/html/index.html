<script>
(async function () {
  const wrap = document.getElementById('posts');
  const catList = document.getElementById('categoryList');
  const tagList = document.getElementById('tagList');
  let posts = [];
  let activeCat = null;
  let activeTag = null;
  let CATEGORIES = [];

  // 取一篇文章的所有标签
  function postTags(p) { return (p.tags || '').split(/[,，、\s]+/).filter(Boolean); }

  function showEmpty(msg) {
    wrap.textContent = '';
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = msg;
    wrap.appendChild(p);
  }

  // 按当前 activeCat/activeTag 过滤并渲染;两者都为空则展示全部
  function filtered() {
    if (!activeCat && !activeTag) return posts;
    return posts.filter((p) =>
      (!activeCat || (p.tag || '未分类') === activeCat) &&
      (!activeTag || postTags(p).indexOf(activeTag) >= 0)
    );
  }
  function refresh() {
    renderPosts(filtered());
    renderCategories();
    renderTags();
  }

  // 渲染文章列表
  function renderPosts(list) {
    wrap.textContent = '';
    if (!Array.isArray(list) || !list.length) {
      const why = activeCat && activeTag
        ? '「' + activeCat + '」且含「#' + activeTag + '」的'
        : (activeCat ? '「' + activeCat + '」' : (activeTag ? '含「#' + activeTag + '」' : ''));
      showEmpty((why || '暂无') + '文章还没找到,再挑挑别的吧ヽ(=^･ω･^=)丿');
      return;
    }
    list.forEach((post) => {
      const art = document.createElement('article');
      art.className = 'post';

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      const d = document.createElement('span');
      d.textContent = post.created_at;
      const dot = document.createElement('span');
      dot.textContent = '·';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = post.tag || '未分类';
      meta.append(d, dot, tag);

      const h2 = document.createElement('h2');
      const a = document.createElement('a');
      a.href = 'post.html?id=' + post.id;
      a.textContent = post.title;
      h2.appendChild(a);

      const ex = document.createElement('p');
      ex.className = 'excerpt';
      ex.textContent = post.excerpt;

      const rm = document.createElement('a');
      rm.className = 'read-more';
      rm.href = 'post.html?id=' + post.id;
      rm.textContent = '继续阅读 →';

      art.append(meta, h2, ex, rm);
      wrap.appendChild(art);
    });
  }

  // 侧栏分类:预置分类(来自 /api/categories) + 文章里出现的额外分类,均带真实计数
  function renderCategories() {
    if (!catList) return;
    catList.textContent = '';

    const cats = CATEGORIES.slice();
    const counts = {};
    posts.forEach((p) => {
      const t = p.tag || '未分类';
      counts[t] = (counts[t] || 0) + 1;
    });
    Object.keys(counts).forEach((t) => { if (!cats.includes(t)) cats.push(t); });

    const addItem = (label, count) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#posts';
      a.dataset.cat = label;
      a.className = activeCat === label ? 'active' : '';
      const txt = document.createElement('span');
      txt.textContent = label + ' ';
      const cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = count;
      a.append(txt, cnt);
      a.addEventListener('click', (e) => {
        e.preventDefault();
        // 「全部」恒清空分类与标签,真正回到全部;其余再点一次取消该过滤
        activeCat = (label === '全部') ? null : ((activeCat === label) ? null : label);
        if (label === '全部') activeTag = null;
        refresh();
      });
      li.appendChild(a);
      catList.appendChild(li);
    };

    addItem('全部', posts.length);
    cats.forEach((c) => addItem(c, counts[c] || 0));
  }

  // 热门标签云:抽取所有文章标签,按出现次数降序,点击按标签过滤
  function renderTags() {
    if (!tagList) return;
    tagList.textContent = '';

    const counts = {};
    posts.forEach((p) => postTags(p).forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'zh')); // 热门在前
    if (!tags.length) {
      tagList.textContent = '还没有标签 ✧';
      return;
    }
    tags.forEach((t) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'tag-chip' + (activeTag === t ? ' active' : '');
      chip.textContent = '#' + t + ' ' + counts[t];
      chip.addEventListener('click', () => {
        activeTag = (activeTag === t) ? null : t; // 再点一次取消
        refresh();
      });
      tagList.appendChild(chip);
    });
  }

  wrap.textContent = ''; // 一进来就清掉静态「加载中…」占位,避免任何情况下残留
  try {
    const res = await fetch('/api/posts');
    if (!res.ok) throw new Error('http ' + res.status);
    posts = await res.json();
    posts = Array.isArray(posts) ? posts : [];
  } catch {
    posts = [];
  }
  try {
    const c = await (await fetch('/api/categories')).json();
    CATEGORIES = (c && Array.isArray(c.categories)) ? c.categories : CATEGORIES;
  } catch {}
  refresh();
})();
</script>
<script>
// 登录后右上角「登录」替换为「文章」:登录态(canManage)显示文章按钮并隐藏登录按钮
(function () {
  const login = document.querySelector('.login-entry');
  const article = document.getElementById('articleBtn');
  if (!login || !article) return;
  (async () => {
    try {
      const me = await (await fetch('/api/me')).json();
      if (me.canManage) {
        login.style.display = 'none';
        article.hidden = false;
      }
    } catch {}
  })();
})();
</script>
<script>
// 前台"正在用"状态:轮询 /api/status,替换 hero 占位。黑名单命中显示温和文案,离线回落默认。
(function () {
  const el = document.getElementById('heroStatus');
  const FALLBACK = '休息中';
  const BLOCKED = '正在专注';
  if (!el) return;
  async function poll() {
    try {
      const s = await (await fetch('/api/status')).json();
      if (s && s.online) {
        if (s.blocked) el.textContent = BLOCKED;                 // 黑名单:不暴露进程
        else if (s.display) el.textContent = '正在用 ' + s.display;
        else el.textContent = FALLBACK;
      } else {
        el.textContent = FALLBACK;
      }
    } catch { /* 连不上先保持现状,下一轮再试 */ }
  }
  poll();
  setInterval(poll, 8000);
})();
</script>
