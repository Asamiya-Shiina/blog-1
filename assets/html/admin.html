<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 · Ciallo～(∠・ω< )⌒☆</title>
<meta name="description" content="沐玺博客的后台管理页面,仅站主可登录管理文章、相册与标签。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c0392b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c0392b'/%3E%3Cstop offset='1' stop-color='%23e67e22'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
<link rel="stylesheet" href="assets/css/ripple.css">
</head>
<body>

<div data-part="bg"></div>

<header class="site-header">
  <nav class="nav">
    <div class="brand brand-clock">
      <span class="bc-greet" id="bcGreet">早上好</span>
      <span class="bc-time" id="bcTime">00:00:00</span>
    </div>
    <div class="menu">
      <a href="index.html" data-ripple>← 返回首页</a>
    </div>
  </nav>
</header>

<!-- 首次设置管理员密码 -->
<div class="login-box" id="setupView" hidden>
  <div class="login-card">
    <h1>设置管理员密码</h1>
    <p class="sub">首次运行,请设置后台管理密码</p>
    <div class="field">
      <label for="setupPassInput">新密码</label>
      <input type="password" id="setupPassInput" autocomplete="new-password" placeholder="至少 6 位">
    </div>
    <div class="field">
      <label for="setupPass2Input">确认密码</label>
      <input type="password" id="setupPass2Input" autocomplete="new-password" placeholder="再次输入">
    </div>
    <button class="btn" id="setupBtn">设置并进入</button>
    <p class="login-err" id="setupErr"></p>
  </div>
</div>

<!-- 登录态 -->
<div class="login-box" id="loginView">
  <div class="login-card">
    <h1>后台登录</h1>
    <p class="sub">输入站主密码进入管理</p>
    <div class="field">
      <label for="passInput">密码</label>
      <input type="password" id="passInput" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <button class="btn" id="loginBtn">登录</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- 管理区(登录后显示) -->
<div class="admin-wrap" id="adminView" hidden>
  <div class="admin-toolbar">
    <h1>文章管理</h1>
    <div>
      <a class="btn small" href="admin-editor.html" data-ripple>＋ 写新文章</a>
      <button class="btn secondary small" id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div class="admin-card">
    <p class="hint">共 <span id="postCount">0</span> 篇文章</p>
    <div id="postList"></div>
    <p class="empty" id="listEmpty" hidden>还没有文章,点「写新文章」开始吧 ✧</p>
  </div>

  <div class="admin-card">
    <div class="editor-head">
      <h2>前台"正在用"状态</h2>
      <button class="btn secondary small" id="procSaveBtn">保存设置</button>
    </div>
    <div class="field">
      <label for="namesInput">进程改名(每行一个,格式 exe=显示名,如 chrome.exe=Chrome)</label>
      <textarea id="namesInput" rows="5" placeholder="chrome.exe=Chrome&#10;WeChat.exe=微信"></textarea>
    </div>
    <div class="field">
      <label for="blockInput">黑名单不予显示(每行一个进程名,前台将显示「正在专注」)</label>
      <textarea id="blockInput" rows="3" placeholder="spotify.exe&#10;games"></textarea>
    </div>
    <p class="hint" id="procStatus"></p>
  </div>
</div>

<div data-part="player"></div>

<!-- 圆形水波过渡层（登录/管理页导航也套用,返回首页与水波一致） -->
<div class="ripple" id="ripple"></div>

<script src="assets/js/partials.js"></script>
<script src="assets/js/player.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/ripple.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
